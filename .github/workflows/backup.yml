# Copia di sicurezza settimanale dei dati (e su richiesta). Il file è CIFRATO prima di lasciare il server:
# il repository è pubblico e gli allegati delle azioni li può scaricare chiunque abbia un account GitHub.
# Serve il segreto BACKUP_PASSPHRASE (Settings → Secrets and variables → Actions): senza, l'azione si ferma.
# Per decifrare: gpg --decrypt backup-AAAA-MM-GG.sql.gpg > backup.sql
name: Copia di sicurezza

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Controllo della frase segreta
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "Manca il segreto BACKUP_PASSPHRASE: aggiungilo in Settings → Secrets and variables → Actions."; exit 1; fi
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Esportazione dei dati (giocatori, partite, voti, account)
        run: supabase db dump --remote --data-only -s public,auth -f backup.sql
      - name: Cifratura
        run: |
          F="backup-$(date -u +%F).sql.gpg"
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "$F" backup.sql
          shred -u backup.sql
          echo "FILE=$F" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 90

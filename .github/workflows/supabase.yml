# Applica le migrazioni e pubblica le Edge Functions su Supabase (avvio manuale).
name: Aggiorna Supabase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # versione fissa: un nuovo rilascio di Supabase non cambia più il comportamento da un giorno all'altro
          version: 3.0.0
      - run: supabase link --project-ref "$PROJECT_REF"
      # CLI v3: i comandi sul database vanno sul progetto online solo con --remote;
      # in automatico (senza nessuno che confermi) le modifiche al progetto vogliono --yes
      - run: supabase db push --remote --yes
      # le funzioni vanno sul progetto collegato con «supabase link»
      - run: supabase functions deploy push-dispatch --no-verify-jwt --yes
      - run: supabase functions deploy quick-action --no-verify-jwt --yes
      - run: supabase functions deploy admin-reset-password --yes

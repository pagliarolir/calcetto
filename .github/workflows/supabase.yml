# Applica le migrazioni e pubblica le Edge Functions su Supabase (avvio manuale).
name: Aggiorna Supabase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy push-dispatch --no-verify-jwt --project-ref "$PROJECT_REF"
      - run: supabase functions deploy quick-action --no-verify-jwt --project-ref "$PROJECT_REF"
      - run: supabase functions deploy admin-reset-password --project-ref "$PROJECT_REF"

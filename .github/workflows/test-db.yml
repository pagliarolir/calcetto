# Verifica le regole del database (slot, leadership, risultato, voti, statistiche) su Postgres.
name: Test database

on:
  push:
    paths: ['supabase/**']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: PGHOST=localhost PGPORT=5432 bash supabase/tests/run.sh

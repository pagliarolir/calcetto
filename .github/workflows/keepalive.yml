# I progetti Supabase gratuiti si sospendono dopo 7 giorni senza attività.
# L'uso settimanale basta già, ma questo ping due volte a settimana è una rete di sicurezza.
name: Tieni sveglio Supabase

on:
  schedule:
    - cron: '17 8 * * 2,6'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/" -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -o /dev/null -w "%{http_code}\n" || true

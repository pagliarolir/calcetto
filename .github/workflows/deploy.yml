# Compila la PWA e la pubblica gratis su GitHub Pages a ogni push su main.
name: Pubblica l'app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrive la configurazione dalle variabili del repository
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          GOOGLE_LOGIN: ${{ vars.GOOGLE_LOGIN || 'false' }}
        run: node scripts/write-env.mjs
      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
        env:
          NG_CLI_ANALYTICS: 'false'
      - name: Navigazione diretta agli indirizzi interni (fallback SPA)
        run: cp dist/calcetto/browser/index.html dist/calcetto/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/calcetto/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

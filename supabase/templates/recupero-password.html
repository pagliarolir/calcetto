<!-- Modello email "Reset Password" in italiano.
     Incollalo in Supabase: Authentication > Email Templates > Reset Password.
     Oggetto consigliato: Recupera la password del Calcetto -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; color: #142019;">
  <h2 style="color: #1f6b45;">Calcetto del giovedì</h2>
  <p>Ciao,</p>
  <p>abbiamo ricevuto una richiesta per reimpostare la password del tuo account.</p>
  <p style="margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="background: #1f6b45; color: #ffffff; padding: 12px 22px; border-radius: 999px; text-decoration: none; font-weight: bold;">
      Scegli una nuova password
    </a>
  </p>
  <p>Il link vale per un'ora e si può usare una sola volta.</p>
  <p style="color: #55655b; font-size: 13px;">Se non sei stato tu, ignora questa email: la tua password resta quella di prima.</p>
</div>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>G.d.L.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Prenotazioni, squadre, risultati e statistiche del calcetto del giovedì.">
  <meta name="theme-color" content="#1F6B45">
  <script>
    /* tema scelto nel Profilo → Aspetto, applicato prima che l'app parta */
    (function () {
      try {
        var c = localStorage.getItem('gdl-theme') || 'auto';
        var t = c === 'auto' ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'notturno' : 'gesso') : c;
        document.documentElement.setAttribute('data-theme', t);
        var bar = { gesso: '#1B6A43', notturno: '#0F1A14', figurina: '#C81E36', contrasto: '#000000' }[t];
        if (bar) document.querySelector('meta[name="theme-color"]').setAttribute('content', bar);
      } catch (e) {}
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default" e non "black-translucent": con la barra trasparente Safari sposta gli elementi fissati
       in basso e la barra di navigazione salta durante i caricamenti (bug WebKit 236445). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="G.d.L.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root>
    <div class="boot" aria-hidden="true"></div>
  </app-root>
  <noscript>Per usare l'app serve JavaScript.</noscript>
</body>
</html>
